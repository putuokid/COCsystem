<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報詳細</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="memo.js"></script></head><body><div class="shell"><header class="header"><button class="btn" id="back">← TOP</button><h1>情報詳細</h1><span class="spacer"></span><button class="btn hidden" id="edit">編集</button></header><div class="layout"><main><div class="detail" id="detail">読み込み中…</div></main><aside class="memo"><h3>共有メモ</h3><textarea id="memo" placeholder="PL同士のメモ・仮説・TODOなど"></textarea><div class="memo-status" id="memoStatus">読み込み中…</div></aside></div></div><script>
const q=new URLSearchParams(location.search),sessionId=Number(q.get('session')),id=Number(q.get('id'));let info,role='pl';async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:m}=await sb.from('t_session_member').select('role').eq('session_id',sessionId).eq('user_id',user.id).single();role=m?.role||'pl';if(role==='gm')edit.classList.remove('hidden');await SharedMemo({sessionId,textarea:memo,status:memoStatus});const {data,error}=await sb.from('t_information').select('*').eq('information_id',id).single();if(error){detail.innerHTML='<p class="error">'+esc(error.message)+'</p>';return}info=data;await show()}
async function signedImage(path){if(!path)return null;const {data,error}=await sb.storage.from('information-images').createSignedUrl(path,3600);return error?null:data.signedUrl}
async function show(){const imageUrl=await signedImage(info.icon_url);const [tagRes,outRes,inRes]=await Promise.all([sb.from('t_information_tag').select('tag_name').eq('information_id',id),sb.from('t_information_relation').select('related_information_id').eq('information_id',id),sb.from('t_information_relation').select('information_id').eq('related_information_id',id)]);const relIds=[...(outRes.data||[]).map(x=>x.related_information_id),...(inRes.data||[]).map(x=>x.information_id)];const unique=[...new Set(relIds)].filter(x=>x!==id);let related=[];if(unique.length){const r=await sb.from('t_information').select('information_id,name,information_type').in('information_id',unique);related=r.data||[]}detail.innerHTML=`<div class="detail-head"><div class="detail-title"><div class="detail-badges"><span class="badge">${label(info.information_type)}</span>${!info.is_public?'<span class="badge private">非公開</span>':''}</div><h2>${esc(info.name)}</h2>${info.summary?`<p class="detail-summary"><strong>${esc(info.summary)}</strong></p>`:''}</div>${imageUrl?`<div class="detail-wipe"><img src="${esc(imageUrl)}" alt="${esc(info.name)}"></div>`:''}</div><div class="content">${esc(info.content||'')}</div><hr><h3>関連情報</h3><div class="relations">${related.length?related.map(x=>`<button class="relation" onclick="location.href='information.html?session=${sessionId}&id=${x.information_id}'">${label(x.information_type)}：${esc(x.name)}</button>`).join(''):'<span class="muted">なし</span>'}</div><h3>タグ</h3><div>${tagRes.data?.length?tagRes.data.map(x=>`<span class="badge">#${esc(x.tag_name)}</span>`).join(''):'<span class="muted">なし</span>'}</div>`}
edit.onclick=()=>location.href=`information-create.html?session=${sessionId}&id=${id}`;back.onclick=()=>location.href=`index.html?session=${sessionId}`;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(t){return ({location:'場所',person:'人物',event:'事件',item:'アイテム',material:'資料'})[t]||t}boot();
</script></body></html>
