<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報登録</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="memo.js"></script></head>
<body><div class="shell"><header class="header"><button class="btn" id="backBtn">← 戻る</button><h1 id="pageTitle">情報新規登録</h1></header><div class="layout"><main><div class="detail"><div class="form-grid">
<div class="field"><label for="typeInput">種類</label><select id="typeInput"><option value="location">場所</option><option value="person">人物</option><option value="event">事件</option><option value="item">アイテム</option><option value="material">資料</option></select></div>
<div class="field"><label for="nameInput">名称</label><input id="nameInput" type="text"></div>
<div class="field"><label for="summaryInput">Summary</label><input id="summaryInput" type="text"></div>
<div class="field" id="imageField"><label>画像</label><div class="image-editor"><div class="image-preview-wrap"><img id="imagePreview" class="image-preview hidden" alt="画像プレビュー"><div id="imagePlaceholder" class="image-placeholder">画像なし</div></div><div class="image-controls"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="btn hidden" id="removeImageBtn" type="button">画像を削除</button><div class="muted">人物・場所に設定できます。JPEG / PNG / WebP / GIF、5MBまで。</div></div></div></div>
<div class="field"><label for="contentInput">内容</label><textarea id="contentInput"></textarea><button class="btn" id="formatBtn" type="button">改行を整形</button></div>
<div class="field"><label>タグ</label><div class="tag-row"><input id="tagInput" type="text" placeholder="例：病院"><button class="btn" id="addTagBtn" type="button">＋追加</button></div><div id="tagChips" class="chips"></div><div class="muted">追加済みタグをクリックすると削除できます。</div></div>
<div class="field"><label>関連情報</label><input id="relationSearch" type="text" placeholder="名称・概要で絞り込み"><div id="relationPicker" class="relation-picker"><span class="muted">読み込み中…</span></div></div>
<div class="field"><label><input type="checkbox" id="publicFlag"> 公開する</label></div>
</div><div class="form-actions"><button class="btn primary" id="saveBtn" type="button">保存</button><button class="btn" id="saveNextBtn" type="button">保存して次へ</button></div><div id="msg" class="save-status"></div></div></main><aside class="memo"><h3>共有メモ</h3><textarea id="memo" placeholder="PL同士のメモ・仮説・TODOなど"></textarea><div class="memo-status" id="memoStatus">読み込み中…</div></aside></div></div>
<script>
const qs=new URLSearchParams(location.search);const sessionId=Number(qs.get('session'));const editId=qs.get('id')?Number(qs.get('id')):null;
const els={pageTitle:document.getElementById('pageTitle'),type:document.getElementById('typeInput'),name:document.getElementById('nameInput'),summary:document.getElementById('summaryInput'),content:document.getElementById('contentInput'),publicFlag:document.getElementById('publicFlag'),tagInput:document.getElementById('tagInput'),tagChips:document.getElementById('tagChips'),relationSearch:document.getElementById('relationSearch'),relationPicker:document.getElementById('relationPicker'),msg:document.getElementById('msg'),save:document.getElementById('saveBtn'),saveNext:document.getElementById('saveNextBtn'),imageField:document.getElementById('imageField'),imageInput:document.getElementById('imageInput'),imagePreview:document.getElementById('imagePreview'),imagePlaceholder:document.getElementById('imagePlaceholder'),removeImage:document.getElementById('removeImageBtn')};
let currentImagePath=null;let selectedImageFile=null;let removeCurrentImage=false;let previewObjectUrl=null;
let tags=[];let infos=[];let selectedRelations=new Set();
function setMsg(text,kind=''){els.msg.textContent=text;els.msg.className='save-status '+kind}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function label(t){return ({location:'場所',person:'人物',event:'事件',item:'アイテム',material:'資料'})[t]||t}
async function signedImage(path){if(!path)return null;const {data,error}=await sb.storage.from('information-images').createSignedUrl(path,3600);return error?null:data.signedUrl}
function updateImageField(){const ok=['person','location'].includes(els.type.value);els.imageField.classList.toggle('hidden',!ok)}
function showPreview(url){if(url){els.imagePreview.src=url;els.imagePreview.classList.remove('hidden');els.imagePlaceholder.classList.add('hidden');els.removeImage.classList.remove('hidden')}else{els.imagePreview.removeAttribute('src');els.imagePreview.classList.add('hidden');els.imagePlaceholder.classList.remove('hidden');els.removeImage.classList.add('hidden')}}
async function uploadImage(){if(!selectedImageFile)return removeCurrentImage?null:currentImagePath;const ext=(selectedImageFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${sessionId}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('information-images').upload(path,selectedImageFile,{contentType:selectedImageFile.type,upsert:false});if(error)throw error;return path}
function normalize(s){return s.replace(/\r\n/g,'\n').split(/\n{2,}/).map(p=>p.split('\n').map(x=>x.trim()).filter(Boolean).join('')).join('\n\n').trim()}
function renderTags(){els.tagChips.innerHTML=tags.length?tags.map((t,i)=>`<button class="chip" type="button" data-tag-index="${i}">#${esc(t)} ×</button>`).join(''):'<span class="muted">タグなし</span>';els.tagChips.querySelectorAll('[data-tag-index]').forEach(b=>b.onclick=()=>{tags.splice(Number(b.dataset.tagIndex),1);renderTags()})}
function addTag(){const t=els.tagInput.value.trim().replace(/^#/,'');if(t&&!tags.includes(t))tags.push(t);els.tagInput.value='';renderTags()}
function renderRelations(){const q=els.relationSearch.value.trim().toLowerCase();const rows=infos.filter(x=>!q||(x.name+' '+(x.summary||'')).toLowerCase().includes(q));els.relationPicker.innerHTML=rows.length?rows.map(x=>`<label class="relation-option"><input type="checkbox" value="${x.information_id}" ${selectedRelations.has(x.information_id)?'checked':''}><span><strong>${esc(x.name)}</strong><small>${label(x.information_type)}${x.summary?' ／ '+esc(x.summary):''}${!x.is_public?' ／ 非公開':''}</small></span></label>`).join(''):'<span class="muted">該当する情報はありません。</span>';els.relationPicker.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{const id=Number(c.value);c.checked?selectedRelations.add(id):selectedRelations.delete(id)})}
async function boot(){if(!Number.isFinite(sessionId)){setMsg('session が指定されていません。','error');return}const {data:{user},error:userError}=await sb.auth.getUser();if(userError||!user){location.href='login.html';return}const {data:member,error:memberError}=await sb.from('t_session_member').select('role').eq('session_id',sessionId).eq('user_id',user.id).maybeSingle();if(memberError){setMsg('参加者情報の取得に失敗しました: '+memberError.message,'error');return}if(member?.role!=='gm'){alert('GMのみ編集できます');location.href=`index.html?session=${sessionId}`;return}await SharedMemo({sessionId,textarea:document.getElementById('memo'),status:document.getElementById('memoStatus')});
const infoRes=await sb.from('t_information').select('information_id,information_type,name,summary,is_public').eq('session_id',sessionId).order('name');if(infoRes.error){setMsg('関連情報候補の取得に失敗しました: '+infoRes.error.message,'error');return}infos=(infoRes.data||[]).filter(x=>x.information_id!==editId);
if(editId){els.pageTitle.textContent='情報編集';const base=await sb.from('t_information').select('*').eq('information_id',editId).single();if(base.error){setMsg('情報の取得に失敗しました: '+base.error.message,'error');return}els.type.value=base.data.information_type;els.name.value=base.data.name;els.summary.value=base.data.summary||'';els.content.value=base.data.content||'';els.publicFlag.checked=base.data.is_public;currentImagePath=base.data.icon_url||null;if(currentImagePath)showPreview(await signedImage(currentImagePath));
const [tagRes,outRes,inRes]=await Promise.all([sb.from('t_information_tag').select('tag_name').eq('information_id',editId),sb.from('t_information_relation').select('related_information_id').eq('information_id',editId),sb.from('t_information_relation').select('information_id').eq('related_information_id',editId)]);if(tagRes.error||outRes.error||inRes.error){setMsg('タグ・関連情報の取得に失敗しました: '+(tagRes.error||outRes.error||inRes.error).message,'error');return}tags=(tagRes.data||[]).map(x=>x.tag_name);[...(outRes.data||[]).map(x=>x.related_information_id),...(inRes.data||[]).map(x=>x.information_id)].forEach(x=>selectedRelations.add(x));}
updateImageField();renderTags();renderRelations()}
async function persist(next){setMsg('保存中…');els.save.disabled=true;els.saveNext.disabled=true;try{const name=els.name.value.trim();if(!name)throw new Error('名称を入力してください。');const wasPublic=editId?null:false;const newImagePath=['person','location'].includes(els.type.value)?await uploadImage():null;const row={session_id:sessionId,information_type:els.type.value,name,summary:els.summary.value.trim()||null,content:els.content.value.trim()||null,icon_url:newImagePath,is_public:els.publicFlag.checked,updated_at:new Date().toISOString()};if(!editId)row.published_at=els.publicFlag.checked?new Date().toISOString():null;else if(els.publicFlag.checked){const cur=await sb.from('t_information').select('published_at').eq('information_id',editId).single();if(cur.error)throw cur.error;row.published_at=cur.data.published_at||new Date().toISOString()}else row.published_at=null;
let saved;if(editId){saved=await sb.from('t_information').update(row).eq('information_id',editId).select().single()}else{saved=await sb.from('t_information').insert(row).select().single()}if(saved.error)throw saved.error;const id=saved.data.information_id;
let r=await sb.from('t_information_tag').delete().eq('information_id',id);if(r.error)throw r.error;if(tags.length){r=await sb.from('t_information_tag').insert(tags.map(tag_name=>({information_id:id,tag_name})));if(r.error)throw r.error}
r=await sb.from('t_information_relation').delete().or(`information_id.eq.${id},related_information_id.eq.${id}`);if(r.error)throw r.error;const relRows=[...selectedRelations].filter(x=>x!==id).map(related_information_id=>({information_id:id,related_information_id}));if(relRows.length){r=await sb.from('t_information_relation').insert(relRows);if(r.error)throw r.error}
if(currentImagePath&&currentImagePath!==newImagePath){await sb.storage.from('information-images').remove([currentImagePath])}currentImagePath=newImagePath;setMsg('保存しました。','ok');if(next&&!editId){location.href=`information-create.html?session=${sessionId}`;return}location.href=`information.html?session=${sessionId}&id=${id}`;}catch(e){console.error(e);setMsg('保存に失敗しました: '+(e.message||String(e)),'error')}finally{els.save.disabled=false;els.saveNext.disabled=false}}
els.type.addEventListener('change',updateImageField);els.imageInput.addEventListener('change',()=>{const f=els.imageInput.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('画像は5MB以下にしてください。');els.imageInput.value='';return}selectedImageFile=f;removeCurrentImage=false;if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=URL.createObjectURL(f);showPreview(previewObjectUrl)});els.removeImage.onclick=()=>{selectedImageFile=null;removeCurrentImage=true;els.imageInput.value='';if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null}showPreview(null)};document.getElementById('formatBtn').onclick=()=>els.content.value=normalize(els.content.value);document.getElementById('addTagBtn').onclick=addTag;els.tagInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTag()}});els.relationSearch.addEventListener('input',renderRelations);els.save.onclick=()=>persist(false);els.saveNext.onclick=()=>persist(true);document.getElementById('backBtn').onclick=()=>history.back();boot();
</script></body></html>
