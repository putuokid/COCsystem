<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報登録</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="shell"><header class="header"><button class="btn" id="back">← 戻る</button><h1 id="title">情報新規登録</h1></header><main><div class="detail"><label>種類</label><p><select id="type"><option value="location">場所</option><option value="person">人物</option><option value="event">事件</option><option value="item">アイテム</option><option value="material">資料</option></select></p><label>名称</label><p><input id="name" style="width:100%;padding:9px"></p><label>Summary</label><p><input id="summary" style="width:100%;padding:9px"></p><label>内容</label><p><textarea id="content" style="width:100%;height:260px;padding:10px"></textarea></p><button class="btn" id="format">改行を整形</button><p><label><input type="checkbox" id="publicFlag"> 公開する</label></p><button class="btn primary" id="save">保存</button> <button class="btn" id="saveNext">保存して次へ</button><div id="msg" class="error"></div></div></main></div><script>
const q=new URLSearchParams(location.search),sessionId=Number(q.get('session')),id=q.get('id');async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:m}=await sb.from('t_session_member').select('role').eq('session_id',sessionId).eq('user_id',user.id).single();if(m?.role!=='gm'){alert('GMのみ編集できます');location.href=`index.html?session=${sessionId}`;return}if(id){title.textContent='情報編集';const {data}=await sb.from('t_information').select('*').eq('information_id',id).single();if(data){type.value=data.information_type;name.value=data.name;summary.value=data.summary||'';content.value=data.content||'';publicFlag.checked=data.is_public}}}
function normalize(s){return s.replace(/\r\n/g,'\n').split(/\n{2,}/).map(p=>p.split('\n').map(x=>x.trim()).filter(Boolean).join('')).join('\n\n').trim()}
format.onclick=()=>content.value=normalize(content.value);async function persist(next){msg.textContent='';const row={session_id:sessionId,information_type:type.value,name:name.value.trim(),summary:summary.value.trim()||null,content:content.value.trim()||null,is_public:publicFlag.checked,published_at:publicFlag.checked?new Date().toISOString():null,updated_at:new Date().toISOString()};let r;if(id)r=await sb.from('t_information').update(row).eq('information_id',id).select().single();else r=await sb.from('t_information').insert(row).select().single();if(r.error){msg.textContent=r.error.message;return}if(next&&!id){location.reload();return}location.href=`information.html?session=${sessionId}&id=${r.data.information_id}`}
save.onclick=()=>persist(false);saveNext.onclick=()=>persist(true);back.onclick=()=>history.back();boot();
</script></body></html>
