<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>参加者管理 - CoC情報管理</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<div class="shell"><header class="header"><button class="btn" id="back">← セッションTOP</button><h1 id="sessionName">参加者管理</h1><span class="badge">GM</span><span class="spacer"></span><button class="btn" id="logout">ログアウト</button></header>
<main class="sessions-main"><div class="participant-head"><div><h2>参加者管理</h2><p class="muted">このセッションに参加するPLを管理します。</p></div></div><div id="status" class="muted"></div><div id="memberList" class="member-list"></div>
<div class="add-member-box"><div><label for="candidate">PLを追加</label><select id="candidate"><option value="">追加するユーザーを選択</option></select></div><button class="btn primary" id="add">＋ PLとして追加</button></div><div id="message"></div></main></div>
<script>
const qs=new URLSearchParams(location.search),sessionId=Number(qs.get('session'));const statusEl=document.getElementById('status'),memberList=document.getElementById('memberList'),candidate=document.getElementById('candidate'),message=document.getElementById('message');
async function boot(){if(!Number.isFinite(sessionId)||sessionId<=0){location.href='sessions.html';return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:check,error}=await sb.rpc('get_session_members',{p_session_id:sessionId});if(error){alert('参加者管理を開けません。\n\n'+error.message);location.href=`index.html?session=${sessionId}`;return}const {data:s}=await sb.from('t_session').select('session_name').eq('session_id',sessionId).single();if(s){sessionName.textContent=s.session_name+' - 参加者管理';document.title=`参加者管理｜${s.session_name}｜CoC情報管理`;}await refresh(check||[])}
async function refresh(prefetched){statusEl.textContent='読み込み中…';let members=prefetched;if(!prefetched.length){const r=await sb.rpc('get_session_members',{p_session_id:sessionId});if(r.error){statusEl.textContent='参加者取得失敗: '+r.error.message;return}members=r.data||[]}renderMembers(members);const c=await sb.rpc('get_addable_session_users',{p_session_id:sessionId});if(c.error){message.innerHTML='<p class="error">追加可能ユーザー取得失敗: '+esc(c.error.message)+'</p>'}else renderCandidates(c.data||[]);statusEl.textContent=''}
function renderMembers(rows){memberList.innerHTML='';rows.forEach(x=>{const d=document.createElement('div');d.className='member-row';d.innerHTML=`<div><div class="member-name">${esc(x.display_name)}</div><div class="member-meta">${x.role.toUpperCase()}</div></div><span class="spacer"></span>${x.role==='pl'?`<button class="btn danger-btn" data-user="${x.user_id}">解除</button>`:'<span class="badge gm-badge">GM</span>'}`;memberList.appendChild(d)});memberList.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>removeMember(b.dataset.user))}
function renderCandidates(rows){candidate.innerHTML='<option value="">追加するユーザーを選択</option>';rows.forEach(x=>{const o=document.createElement('option');o.value=x.user_id;o.textContent=x.display_name;candidate.appendChild(o)});document.getElementById('add').disabled=!rows.length}
async function addMember(){const uid=candidate.value;if(!uid){message.innerHTML='<p class="error">追加するユーザーを選択してください。</p>';return}const {error}=await sb.rpc('add_session_pl',{p_session_id:sessionId,p_user_id:uid});if(error){message.innerHTML='<p class="error">追加失敗: '+esc(error.message)+'</p>';return}message.innerHTML='<p class="notice">PLを追加しました。</p>';await refresh([])}
async function removeMember(uid){if(!confirm('このPLをセッションから解除しますか？\n情報そのものは削除されません。'))return;const {error}=await sb.rpc('remove_session_pl',{p_session_id:sessionId,p_user_id:uid});if(error){message.innerHTML='<p class="error">解除失敗: '+esc(error.message)+'</p>';return}message.innerHTML='<p class="notice">PLを解除しました。</p>';await refresh([])}
document.getElementById('add').onclick=addMember;document.getElementById('back').onclick=()=>location.href=`index.html?session=${sessionId}`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
