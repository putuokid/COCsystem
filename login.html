<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>ログイン｜CoC情報管理</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js" defer></script></head><body><div class="login"><h2>CoC 情報管理</h2><p class="muted">Supabase Authでログインします。</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn primary" id="login">ログイン</button><div id="error" class="error"></div></div><script>window.addEventListener('DOMContentLoaded',()=>{document.getElementById('login').onclick=async()=>{const error=document.getElementById('error');error.textContent='';const {error:e}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(e){error.textContent=e.message;return}location.href='sessions.html';};});</script></body></html>
