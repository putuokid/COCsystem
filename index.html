<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoC情報管理</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="shell"><header class="header"><h1 id="sessionName">CoC 情報管理</h1><span id="role" class="badge"></span><span class="spacer"></span><button class="btn" id="logout">ログアウト</button></header><div class="layout"><main><div class="tabs" id="tabs"></div><div class="toolbar"><input id="search" placeholder="名称・概要・内容から検索"><button class="btn primary hidden" id="create">＋ 新規登録</button></div><div id="list"></div></main><aside class="memo"><h3>共有メモ</h3><textarea id="memo" placeholder="PL同士のメモ・仮説・TODOなど"></textarea><div class="muted" id="memoStatus"></div></aside></div></div><script>
const qs=new URLSearchParams(location.search), sessionId=Number(qs.get('session')||1);let all=[],type='latest',meRole='pl',memoTimer;const types=[['latest','最新'],['location','場所'],['person','人物'],['event','事件'],['item','アイテム'],['material','資料']];
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:member}=await sb.from('t_session_member').select('role').eq('session_id',sessionId).eq('user_id',user.id).single();if(!member){alert('このセッションの参加者ではありません');return}meRole=member.role;role.textContent=meRole.toUpperCase();if(meRole==='gm')create.classList.remove('hidden');const {data:s}=await sb.from('t_session').select('session_name').eq('session_id',sessionId).single();if(s)sessionName.textContent=s.session_name;renderTabs();await loadInfo();await loadMemo();}
function renderTabs(){tabs.innerHTML='';types.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=k===type?'active':'';b.onclick=()=>{type=k;renderTabs();render()};tabs.appendChild(b)});}
async function loadInfo(){const {data,error}=await sb.from('t_information').select('information_id,information_type,name,summary,is_public,published_at,created_at').eq('session_id',sessionId).order('published_at',{ascending:false,nullsFirst:false});if(error){list.innerHTML='<p class="error">'+error.message+'</p>';return}all=data||[];render()}
function render(){const q=search.value.trim().toLowerCase();let rows=all.filter(x=>(type==='latest'||x.information_type===type));if(q)rows=rows.filter(x=>(x.name+' '+(x.summary||'')).toLowerCase().includes(q));list.innerHTML=rows.length?'':'<p class="muted">該当する情報はありません。</p>';rows.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${esc(x.name)} ${!x.is_public?'<span class="badge private">非公開</span>':''}</h3><div>${esc(x.summary||'')}</div><div class="muted">${label(x.information_type)}</div>`;d.onclick=()=>location.href=`information.html?session=${sessionId}&id=${x.information_id}`;list.appendChild(d)})}
async function loadMemo(){const {data}=await sb.from('t_session_memo').select('content').eq('session_id',sessionId).maybeSingle();memo.value=data?.content||''}
async function saveMemo(){memoStatus.textContent='保存中…';const {error}=await sb.from('t_session_memo').upsert({session_id:sessionId,content:memo.value,updated_at:new Date().toISOString()});memoStatus.textContent=error?'保存失敗: '+error.message:'保存済み'}
memo.addEventListener('input',()=>{clearTimeout(memoTimer);memoTimer=setTimeout(saveMemo,700)});search.addEventListener('input',render);create.onclick=()=>location.href=`information-create.html?session=${sessionId}`;logout.onclick=async()=>{await sb.auth.signOut();location.href='login.html'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(t){return ({location:'場所',person:'人物',event:'事件',item:'アイテム',material:'資料'})[t]||t}boot();
</script></body></html>
