<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>CoC情報管理</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="memo.js"></script></head><body><div class="shell"><header class="header"><button class="btn" id="sessionsBack">← セッション一覧</button><h1 id="sessionName">CoC 情報管理</h1><span id="role" class="badge"></span><span class="spacer"></span><button class="btn hidden manage-members" id="members">参加者管理</button><button class="btn" id="logout">ログアウト</button></header><div class="layout"><main><div class="tabs" id="tabs"></div><div class="toolbar"><input id="search" placeholder="名称・概要・内容から検索"><button class="btn primary hidden" id="create">＋ 新規登録</button></div><div id="list"></div></main><aside class="memo"><h3>共有メモ</h3><textarea id="memo" placeholder="PL同士のメモ・仮説・TODOなど"></textarea><div class="memo-status" id="memoStatus">読み込み中…</div></aside></div></div><script>
const qs=new URLSearchParams(location.search), sessionId=Number(qs.get('session'));let all=[],historyRows=[],type='latest',meRole='pl';const types=[['latest','最新'],['location','場所'],['person','人物'],['event','事件'],['item','アイテム'],['material','資料']];
async function boot(){if(!Number.isFinite(sessionId)||sessionId<=0){location.href='sessions.html';return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:member,error:memberError}=await sb.from('t_session_member').select('session_id,user_id,role').eq('session_id',sessionId).eq('user_id',user.id).maybeSingle();if(memberError){console.error(memberError);alert('参加者情報の取得に失敗しました。\n\n'+memberError.message);return}if(!member){alert('このセッションの参加者ではありません。');return}meRole=member.role;role.textContent=meRole.toUpperCase();if(meRole==='gm'){create.classList.remove('hidden');members.classList.remove('hidden')}const {data:s}=await sb.from('t_session').select('session_name').eq('session_id',sessionId).single();if(s){sessionName.textContent=s.session_name;document.title=`${s.session_name}｜CoC情報管理`;}renderTabs();await loadInfo();await SharedMemo({sessionId,textarea:memo,status:memoStatus})}
function renderTabs(){tabs.innerHTML='';types.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=k===type?'active':'';b.onclick=()=>{type=k;renderTabs();render()};tabs.appendChild(b)})}
async function loadInfo(){const infoRes=await sb.from('t_information').select('information_id,information_type,name,summary,icon_url,is_public,published_at,created_at').eq('session_id',sessionId).order('published_at',{ascending:false,nullsFirst:false});if(infoRes.error){list.innerHTML='<p class="error">'+esc(infoRes.error.message)+'</p>';return}all=infoRes.data||[];const hRes=await sb.from('t_information_history').select('history_id,information_id,event_type,event_at').eq('session_id',sessionId).order('event_at',{ascending:false}).limit(200);if(hRes.error){list.innerHTML='<p class="error">最新履歴の取得に失敗しました: '+esc(hRes.error.message)+'</p>';return}const visible=new Map(all.map(x=>[x.information_id,x]));historyRows=(hRes.data||[]).map(h=>({...h,info:visible.get(h.information_id)})).filter(h=>h.info);render()}
async function signedImage(path){if(!path)return null;const {data,error}=await sb.storage.from('information-images').createSignedUrl(path,3600);return error?null:data.signedUrl}
async function render(){const q=search.value.trim().toLowerCase();if(type==='latest'){renderTimeline(q);return}let rows=all.filter(x=>x.information_type===type);if(q)rows=rows.filter(x=>(x.name+' '+(x.summary||'')).toLowerCase().includes(q));list.innerHTML=rows.length?'':'<p class="muted">該当する情報はありません。</p>';for(const x of rows){const d=document.createElement('div');d.className='card info-card';const imageUrl=['person','location'].includes(x.information_type)?await signedImage(x.icon_url):null;d.innerHTML=`${imageUrl?`<img class="card-thumb" src="${esc(imageUrl)}" alt="">`:''}<div class="card-copy"><h3>${esc(x.name)} ${!x.is_public?'<span class="badge private">非公開</span>':''}</h3><div>${esc(x.summary||'')}</div><div class="muted">${label(x.information_type)}</div></div>`;d.onclick=()=>openInfo(x.information_id);list.appendChild(d)}}
function renderTimeline(q){let rows=historyRows;if(q)rows=rows.filter(h=>(h.info.name+' '+(h.info.summary||'')).toLowerCase().includes(q));list.innerHTML=rows.length?'':'<p class="muted">公開・更新履歴はまだありません。</p>';let lastDay='';rows.forEach(h=>{const dt=new Date(h.event_at),day=formatDay(dt);if(day!==lastDay){const sep=document.createElement('div');sep.className='timeline-day';sep.textContent=day;list.appendChild(sep);lastDay=day}const d=document.createElement('div');d.className='timeline-item';const isPublish=h.event_type==='publish';d.innerHTML=`<div class="timeline-time">${time(dt)}</div><div class="timeline-marker ${isPublish?'publish':'update'}">${icon(h.info.information_type)}</div><div class="timeline-body"><div class="timeline-title">${esc(h.info.name)}</div><div class="timeline-event">${isPublish?'新しく公開されました':'情報が更新されました'} <span class="timeline-type">${label(h.info.information_type)}</span></div>${h.info.summary?`<div class="timeline-summary">${esc(h.info.summary)}</div>`:''}</div>`;d.onclick=()=>openInfo(h.information_id);list.appendChild(d)})}
function openInfo(id){location.href=`information.html?session=${sessionId}&id=${id}`}
function formatDay(d){const today=new Date(),y=new Date(today);y.setDate(today.getDate()-1);if(d.toDateString()===today.toDateString())return '今日';if(d.toDateString()===y.toDateString())return '昨日';return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
function time(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function icon(t){return ({location:'⌖',person:'♟',event:'◈',item:'◆',material:'▤'})[t]||'•'}
search.addEventListener('input',render);create.onclick=()=>location.href=`information-create.html?session=${sessionId}`;sessionsBack.onclick=()=>location.href='sessions.html';members.onclick=()=>location.href=`session-members.html?session=${sessionId}`;logout.onclick=async()=>{await sb.auth.signOut();location.href='login.html'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(t){return ({location:'場所',person:'人物',event:'事件',item:'アイテム',material:'資料'})[t]||t}boot();
</script></body></html>
